# Project-wide Gradle settings

# JVM args optimized for low-RAM system (3.7GB)
org.gradle.jvmargs=-Xmx1536m -Dfile.encoding=UTF-8

# Use single worker to avoid OOM
org.gradle.workers.max=1

# Enable Gradle caching
org.gradle.caching=true

# AndroidX
android.useAndroidX=true

# Non-transitive R classes for faster builds
android.nonTransitiveRClass=true

# Kotlin code style
kotlin.code.style=official

# Disable configuration cache for stability with KSP
org.gradle.configuration-cache=false

# Optional fallback Pexels API key placeholder (override in local.properties)
PEXELS_API_KEY=YOUR_PEXELS_API_KEY_HERE
